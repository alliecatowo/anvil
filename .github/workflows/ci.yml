name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - AnvilACP
          - AnvilApplication
          - AnvilDomain
          - AnvilEditor
          - AnvilGit
          - AnvilGitHub
          - AnvilInfrastructure
          - AnvilPluginSDK
          - AnvilTerminal
          - AnvilUI
    steps:
      - uses: actions/checkout@v7
      - run: swift test --package-path "Packages/${{ matrix.package }}"
