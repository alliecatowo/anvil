name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Discover (temporary)
        run: |
          for m in Packages/*/Package.swift; do
            d=$(dirname "$m")
            if swift test --package-path "$d" >"/tmp/$(basename $d).log" 2>&1; then echo "RESULT PASS $d"; else echo "RESULT FAIL $d"; fi
          done
