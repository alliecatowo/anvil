name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # AnvilApplication, AnvilEditor, AnvilGit and AnvilUI tests do not build/pass on master today; add them back once fixed.
      - run: |
          for p in AnvilACP AnvilDomain AnvilGitHub AnvilInfrastructure AnvilPluginSDK AnvilTerminal; do
            echo "==> swift test $p"
            swift test --package-path "Packages/$p"
          done
